server:
  port: 8080

spring:
  application:
    name: user-auth-system
  
  # MySQL数据库配置（Docker环境）
  datasource:
    url: jdbc:mysql://mysql:3306/user_auth_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: auth_user
    password: auth_password
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: validate  # 生产环境使用validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        # 连接池配置
        connection:
          provider_disables_autocommit: true
  
  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  
  # Redis配置（Docker环境）
  redis:
    host: redis
    port: 6379
    password: 
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

# JWT配置
jwt:
  secret: your-secret-key-here-make-it-long-and-secure
  expiration: 86400000 # 24小时

# 日志配置
logging:
  level:
    com.example: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE 