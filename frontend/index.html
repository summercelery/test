<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户认证系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <!-- 背景动画 -->
    <div class="background-animation">
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
            <div class="shape shape-5"></div>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 登录页面 -->
        <div id="login-page" class="auth-page active">
            <div class="auth-container">
                <div class="auth-card">
                    <div class="auth-header">
                        <div class="logo">
                            <i class="fas fa-shield-alt"></i>
                        </div>
                        <h2>欢迎回来</h2>
                        <p>请登录您的账户</p>
                    </div>
                    
                    <!-- 密码登录表单 -->
                    <form id="passwordLoginForm" class="auth-form">
                        <div class="form-group">
                            <div class="input-group">
                                <span class="input-icon">
                                    <i class="fas fa-mobile-alt"></i>
                                </span>
                                <input type="tel" 
                                       id="loginPhone" 
                                       class="form-control" 
                                       placeholder="请输入手机号"
                                       pattern="[0-9]{11}"
                                       required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <div class="input-group">
                                <span class="input-icon">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" 
                                       id="loginPassword" 
                                       class="form-control" 
                                       placeholder="请输入密码"
                                       required>
                                <button type="button" class="password-toggle" onclick="togglePassword('loginPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="form-options">
                            <label class="checkbox-container">
                                <input type="checkbox" id="rememberMe">
                                <span class="checkmark"></span>
                                记住我
                            </label>
                            <a href="#" class="forgot-password" onclick="showForgotPasswordModal()">忘记密码？</a>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-block">
                            <span class="btn-text">登录</span>
                            <span class="btn-loading" style="display: none;">
                                <i class="fas fa-spinner fa-spin"></i>
                            </span>
                        </button>
                    </form>

                    <!-- 其他登录方式 -->
                    <div class="other-login-methods">
                        <div class="divider">
                            <span>其他登录方式</span>
                        </div>
                        
                        <div class="login-methods">
                            <button type="button" class="login-method-btn sms-btn" onclick="showSmsLoginModal()">
                                <i class="fas fa-mobile-alt"></i>
                                <span>验证码登录</span>
                            </button>
                            
                            <button type="button" class="login-method-btn wechat-btn" onclick="wechatLogin()">
                                <i class="fab fa-weixin"></i>
                                <span>微信登录</span>
                            </button>
                        </div>
                    </div>
                    
                    <div class="auth-footer">
                        <p>还没有账户？ <a href="#" onclick="showRegisterModal()">立即注册</a></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 用户仪表板 -->
        <div id="dashboard-page" class="dashboard-page" style="display: none;">
            <nav class="dashboard-nav">
                <div class="nav-brand">
                    <i class="fas fa-shield-alt"></i>
                    <span>用户认证系统</span>
                </div>
                <div class="nav-user">
                    <span class="user-name" id="userName">用户</span>
                    <button class="btn btn-outline-light btn-sm" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> 退出
                    </button>
                </div>
            </nav>
            
            <div class="dashboard-content">
                <div class="welcome-section">
                    <h1>欢迎回来，<span id="welcomeUserName">用户</span>！</h1>
                    <p>这里是您的个人仪表板</p>
                </div>
                
                <div class="dashboard-cards">
                    <div class="dashboard-card">
                        <div class="card-icon">
                            <i class="fas fa-user-circle"></i>
                        </div>
                        <h3>个人资料</h3>
                        <p>查看和编辑您的个人信息</p>
                        <button class="btn btn-primary" onclick="loadUserProfile()">
                            查看资料
                        </button>
                    </div>
                    
                    <div class="dashboard-card">
                        <div class="card-icon">
                            <i class="fas fa-shield-check"></i>
                        </div>
                        <h3>安全设置</h3>
                        <p>管理您的账户安全选项</p>
                        <button class="btn btn-outline-primary" onclick="testAuth()">
                            测试认证
                        </button>
                    </div>
                    
                    <div class="dashboard-card">
                        <div class="card-icon">
                            <i class="fas fa-cog"></i>
                        </div>
                        <h3>系统设置</h3>
                        <p>配置您的系统偏好</p>
                        <button class="btn btn-outline-primary">
                            设置
                        </button>
                    </div>
                    
                    <div class="dashboard-card">
                        <div class="card-icon">
                            <i class="fas fa-redis"></i>
                        </div>
                        <h3>会话管理</h3>
                        <p>管理您的登录会话和设备</p>
                        <button class="btn btn-outline-primary" onclick="loadSessionStats()">
                            查看会话
                        </button>
                    </div>
                </div>
                
                <div id="profileSection" class="profile-section" style="display: none;">
                    <div class="profile-card">
                        <div class="profile-header">
                            <h3><i class="fas fa-user"></i> 个人资料</h3>
                        </div>
                        <div id="profileContent" class="profile-content">
                            <div class="text-center">
                                <div class="spinner-border" role="status">
                                    <span class="visually-hidden">加载中...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 短信验证码登录模态框 -->
    <div class="modal fade" id="smsLoginModal" tabindex="-1" aria-labelledby="smsLoginModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="smsLoginModalLabel">
                        <i class="fas fa-mobile-alt"></i> 验证码登录
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="smsLoginForm">
                        <div class="form-group mb-3">
                            <label for="smsLoginPhone" class="form-label">手机号</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-mobile-alt"></i>
                                </span>
                                <input type="tel" 
                                       class="form-control" 
                                       id="smsLoginPhone" 
                                       placeholder="请输入11位手机号"
                                       pattern="[0-9]{11}"
                                       required>
                            </div>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="smsLoginCode" class="form-label">验证码</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-key"></i>
                                </span>
                                <input type="text" 
                                       class="form-control" 
                                       id="smsLoginCode" 
                                       placeholder="请输入6位验证码"
                                       pattern="[0-9]{6}"
                                       maxlength="6"
                                       required>
                                <button type="button" class="btn btn-outline-primary send-code-btn" onclick="sendSmsCode('LOGIN')">
                                    <span class="send-code-text">发送验证码</span>
                                    <span class="send-code-countdown" style="display: none;">60s</span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="handleSmsLogin()">
                        <span class="btn-text">登录</span>
                        <span class="btn-loading" style="display: none;">
                            <i class="fas fa-spinner fa-spin"></i>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 忘记密码模态框 -->
    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="forgotPasswordModalLabel">
                        <i class="fas fa-key"></i> 重置密码
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="forgotPasswordForm">
                        <div class="form-group mb-3">
                            <label for="resetPhone" class="form-label">手机号</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-mobile-alt"></i>
                                </span>
                                <input type="tel" 
                                       class="form-control" 
                                       id="resetPhone" 
                                       placeholder="请输入11位手机号"
                                       pattern="[0-9]{11}"
                                       required>
                            </div>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="resetCode" class="form-label">验证码</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-key"></i>
                                </span>
                                <input type="text" 
                                       class="form-control" 
                                       id="resetCode" 
                                       placeholder="请输入6位验证码"
                                       pattern="[0-9]{6}"
                                       maxlength="6"
                                       required>
                                <button type="button" class="btn btn-outline-primary send-code-btn" onclick="sendSmsCode('RESET_PASSWORD')">
                                    <span class="send-code-text">发送验证码</span>
                                    <span class="send-code-countdown" style="display: none;">60s</span>
                                </button>
                            </div>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="newPassword" class="form-label">新密码</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" 
                                       class="form-control" 
                                       id="newPassword" 
                                       placeholder="请输入新密码（至少6位）"
                                       minlength="6"
                                       required>
                                <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('newPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="confirmNewPassword" class="form-label">确认新密码</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" 
                                       class="form-control" 
                                       id="confirmNewPassword" 
                                       placeholder="请再次输入新密码"
                                       required>
                                <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('confirmNewPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="handleResetPassword()">
                        <span class="btn-text">重置密码</span>
                        <span class="btn-loading" style="display: none;">
                            <i class="fas fa-spinner fa-spin"></i>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 注册模态框 -->
    <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="registerModalLabel">
                        <i class="fas fa-user-plus"></i> 用户注册
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="registerForm">
                        <div class="form-group mb-3">
                            <label for="registerPhone" class="form-label">手机号</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-mobile-alt"></i>
                                </span>
                                <input type="tel" 
                                       class="form-control" 
                                       id="registerPhone" 
                                       placeholder="请输入11位手机号"
                                       pattern="[0-9]{11}"
                                       required>
                            </div>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="registerEmail" class="form-label">邮箱地址</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-envelope"></i>
                                </span>
                                <input type="email" 
                                       class="form-control" 
                                       id="registerEmail" 
                                       placeholder="请输入邮箱地址"
                                       required>
                            </div>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="registerPassword" class="form-label">密码</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" 
                                       class="form-control" 
                                       id="registerPassword" 
                                       placeholder="请输入密码（至少6位）"
                                       minlength="6"
                                       required>
                                <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('registerPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="confirmPassword" class="form-label">确认密码</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" 
                                       class="form-control" 
                                       id="confirmPassword" 
                                       placeholder="请再次输入密码"
                                       required>
                                <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('confirmPassword')">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                            <label class="form-check-label" for="agreeTerms">
                                我已阅读并同意 <a href="#" class="text-primary">服务条款</a> 和 <a href="#" class="text-primary">隐私政策</a>
                            </label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick="handleRegister()">
                        <span class="btn-text">注册</span>
                        <span class="btn-loading" style="display: none;">
                            <i class="fas fa-spinner fa-spin"></i>
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 消息提示 -->
    <div id="messageContainer" class="message-container">
        <div id="messageBox" class="message-box" style="display: none;">
            <div class="message-icon">
                <i id="messageIcon" class="fas fa-info-circle"></i>
            </div>
            <div class="message-content">
                <h4 id="messageTitle" class="message-title">消息</h4>
                <p id="messageText" class="message-text">这是一条消息</p>
            </div>
            <button type="button" class="message-close" onclick="hideMessage()">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
