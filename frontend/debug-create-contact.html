<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建联系人调试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-user-plus"></i> 创建联系人调试</h3>
                        <p class="text-muted mb-0">调试创建联系人API的响应数据格式</p>
                    </div>
                    <div class="card-body">
                        <!-- 测试表单 -->
                        <div class="row">
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h5>测试参数</h5>
                                    </div>
                                    <div class="card-body">
                                        <form id="debugForm">
                                            <div class="mb-3">
                                                <label class="form-label">联系人姓名</label>
                                                <input type="text" class="form-control" id="debugName" value="测试联系人">
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">手机号</label>
                                                <input type="text" class="form-control" id="debugPhone" value="13800138000">
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">微信号</label>
                                                <input type="text" class="form-control" id="debugWechat" placeholder="可选">
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">标签ID（JSON数组）</label>
                                                <input type="text" class="form-control" id="debugTagIds" value="[]">
                                                <small class="text-muted">例如: [1, 2, 3]</small>
                                            </div>
                                            <button type="button" class="btn btn-primary" onclick="debugCreateContact()">
                                                <i class="fas fa-bug"></i> 调试创建联系人
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <div class="card">
                                    <div class="card-header">
                                        <h5>响应数据分析</h5>
                                    </div>
                                    <div class="card-body">
                                        <div id="responseAnalysis" class="text-muted">
                                            请点击调试按钮查看响应数据...
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 详细响应数据 -->
                        <div class="row mt-4">
                            <div class="col-12">
                                <div class="card">
                                    <div class="card-header">
                                        <h5>完整响应数据</h5>
                                    </div>
                                    <div class="card-body">
                                        <pre id="responseData" class="bg-light p-3 rounded" style="max-height: 400px; overflow-y: auto;">
暂无数据
                                        </pre>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script>
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 创建联系人调试页面初始化');
            AppState.init();
        });

        // 调试创建联系人
        async function debugCreateContact() {
            const button = document.querySelector('button[onclick="debugCreateContact()"]');
            const responseAnalysis = document.getElementById('responseAnalysis');
            const responseData = document.getElementById('responseData');
            
            try {
                // 设置按钮为加载状态
                button.disabled = true;
                button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 调试中...';
                
                // 收集表单数据
                const name = document.getElementById('debugName').value.trim();
                const phoneNumber = document.getElementById('debugPhone').value.trim();
                const wechatOpenid = document.getElementById('debugWechat').value.trim();
                const tagIdsStr = document.getElementById('debugTagIds').value.trim();
                
                let tagIds = [];
                try {
                    tagIds = JSON.parse(tagIdsStr || '[]');
                } catch (e) {
                    throw new Error('标签ID格式错误，请输入有效的JSON数组');
                }
                
                // 准备请求数据
                const requestData = {
                    name,
                    phoneNumber: phoneNumber || null,
                    wechatOpenid: wechatOpenid || null,
                    tagIds
                };
                
                console.log('📤 发送请求数据:', requestData);
                
                // 记录开始时间
                const startTime = Date.now();
                
                // 发送请求
                const { response, data } = await API.post('/contacts', requestData);
                
                // 计算响应时间
                const duration = Date.now() - startTime;
                
                console.log('📥 收到响应:', { response, data });
                
                // 分析响应数据
                const analysis = analyzeResponse(response, data, duration);
                
                // 显示分析结果
                responseAnalysis.innerHTML = analysis.html;
                
                // 显示完整响应数据
                responseData.innerHTML = JSON.stringify({
                    request: requestData,
                    response: {
                        status: response.status,
                        statusText: response.statusText,
                        ok: response.ok,
                        headers: Object.fromEntries(response.headers.entries())
                    },
                    data: data,
                    meta: {
                        duration: duration + 'ms',
                        timestamp: new Date().toISOString()
                    }
                }, null, 2);
                
            } catch (error) {
                console.error('❌ 调试过程出错:', error);
                
                responseAnalysis.innerHTML = `
                    <div class="alert alert-danger">
                        <strong>调试过程出错:</strong> ${error.message}
                    </div>
                `;
                
                responseData.innerHTML = JSON.stringify({
                    error: error.message,
                    stack: error.stack,
                    timestamp: new Date().toISOString()
                }, null, 2);
            } finally {
                // 恢复按钮状态
                button.disabled = false;
                button.innerHTML = '<i class="fas fa-bug"></i> 调试创建联系人';
            }
        }

        // 分析响应数据
        function analyzeResponse(response, data, duration) {
            const analysis = {
                success: false,
                warnings: [],
                errors: [],
                info: []
            };
            
            // 分析HTTP状态码
            if (response.ok) {
                analysis.info.push(`✅ HTTP状态码: ${response.status} (成功)`);
            } else {
                analysis.errors.push(`❌ HTTP状态码: ${response.status} (失败)`);
            }
            
            // 分析响应时间
            if (duration < 1000) {
                analysis.info.push(`⚡ 响应时间: ${duration}ms (正常)`);
            } else {
                analysis.warnings.push(`⚠️ 响应时间: ${duration}ms (较慢)`);
            }
            
            // 分析数据格式
            if (data && typeof data === 'object') {
                analysis.info.push(`📊 数据类型: object`);
                
                // 检查success字段
                if (data.hasOwnProperty('success')) {
                    if (data.success === true) {
                        analysis.info.push(`✅ success字段: true (成功)`);
                        analysis.success = true;
                    } else if (data.success === false) {
                        analysis.errors.push(`❌ success字段: false (业务失败)`);
                    } else {
                        analysis.warnings.push(`⚠️ success字段: ${data.success} (非布尔值)`);
                    }
                } else {
                    analysis.warnings.push(`⚠️ 缺少success字段`);
                }
                
                // 检查message字段
                if (data.hasOwnProperty('message')) {
                    analysis.info.push(`💬 message: "${data.message}"`);
                } else {
                    analysis.warnings.push(`⚠️ 缺少message字段`);
                }
                
                // 检查data字段
                if (data.hasOwnProperty('data')) {
                    if (data.data) {
                        analysis.info.push(`📦 data字段: 存在 (${typeof data.data})`);
                    } else {
                        analysis.warnings.push(`⚠️ data字段: 空值`);
                    }
                } else {
                    analysis.warnings.push(`⚠️ 缺少data字段`);
                }
                
            } else {
                analysis.errors.push(`❌ 数据类型: ${typeof data} (非对象)`);
            }
            
            // 生成HTML
            let html = '';
            
            if (analysis.success) {
                html += '<div class="alert alert-success"><strong>🎉 创建成功!</strong></div>';
            } else {
                html += '<div class="alert alert-danger"><strong>💥 创建失败!</strong></div>';
            }
            
            if (analysis.info.length > 0) {
                html += '<div class="mb-3"><strong>信息:</strong><ul class="mb-0">';
                analysis.info.forEach(info => {
                    html += `<li>${info}</li>`;
                });
                html += '</ul></div>';
            }
            
            if (analysis.warnings.length > 0) {
                html += '<div class="mb-3"><strong>警告:</strong><ul class="mb-0 text-warning">';
                analysis.warnings.forEach(warning => {
                    html += `<li>${warning}</li>`;
                });
                html += '</ul></div>';
            }
            
            if (analysis.errors.length > 0) {
                html += '<div class="mb-3"><strong>错误:</strong><ul class="mb-0 text-danger">';
                analysis.errors.forEach(error => {
                    html += `<li>${error}</li>`;
                });
                html += '</ul></div>';
            }
            
            // 判断逻辑说明
            html += '<div class="mt-3 p-3 bg-light rounded">';
            html += '<strong>前端判断逻辑:</strong><br>';
            html += '<code>if (response.ok && data.success) { /* 成功 */ } else { /* 失败 */ }</code><br>';
            html += `<strong>当前判断结果:</strong> response.ok=${response.ok}, data.success=${data?.success} → ${response.ok && data?.success ? '成功' : '失败'}`;
            html += '</div>';
            
            return { ...analysis, html };
        }
    </script>
</body>
</html>
