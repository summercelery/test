<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后端API修复测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-bug"></i> 后端API修复测试</h3>
                        <p class="text-muted mb-0">测试修复后的API调用逻辑，能够正确处理后端返回的空对象{}格式</p>
                    </div>
                    <div class="card-body">
                        <!-- 测试结果显示区域 -->
                        <div id="testResults" class="mb-4"></div>
                        
                        <!-- 测试按钮 -->
                        <div class="row">
                            <div class="col-md-4">
                                <div class="card border-primary">
                                    <div class="card-body text-center">
                                        <h5 class="card-title">
                                            <i class="fas fa-users text-primary"></i> 联系人API
                                        </h5>
                                        <p class="card-text">测试 /api/contacts 接口</p>
                                        <button class="btn btn-primary" onclick="testContactsAPI()">
                                            <i class="fas fa-play"></i> 测试联系人API
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="col-md-4">
                                <div class="card border-success">
                                    <div class="card-body text-center">
                                        <h5 class="card-title">
                                            <i class="fas fa-tags text-success"></i> 标签API
                                        </h5>
                                        <p class="card-text">测试 /api/tags 接口</p>
                                        <button class="btn btn-success" onclick="testTagsAPI()">
                                            <i class="fas fa-play"></i> 测试标签API
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="col-md-4">
                                <div class="card border-warning">
                                    <div class="card-body text-center">
                                        <h5 class="card-title">
                                            <i class="fas fa-bell text-warning"></i> 提醒API
                                        </h5>
                                        <p class="card-text">测试 /api/reminders 接口</p>
                                        <button class="btn btn-warning" onclick="testRemindersAPI()">
                                            <i class="fas fa-play"></i> 测试提醒API
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row mt-3">
                            <div class="col-12">
                                <div class="card border-info">
                                    <div class="card-body text-center">
                                        <h5 class="card-title">
                                            <i class="fas fa-list-check text-info"></i> 全部测试
                                        </h5>
                                        <p class="card-text">一次性测试所有API接口</p>
                                        <button class="btn btn-info" onclick="testAllAPIs()">
                                            <i class="fas fa-play-circle"></i> 测试所有API
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
    <script>
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 后端API修复测试页面初始化');
            AppState.init();
            
            // 显示初始状态
            showStatus('准备就绪', 'info');
        });
        
        // 显示状态信息
        function showStatus(message, type = 'info') {
            const resultsDiv = document.getElementById('testResults');
            const alertClass = type === 'error' ? 'danger' : type;
            
            resultsDiv.innerHTML = `
                <div class="alert alert-${alertClass}" role="alert">
                    <i class="fas fa-${getStatusIcon(type)}"></i>
                    ${message}
                </div>
            `;
        }
        
        // 获取状态图标
        function getStatusIcon(type) {
            switch(type) {
                case 'success': return 'check-circle';
                case 'error': return 'exclamation-triangle';
                case 'warning': return 'exclamation-circle';
                case 'info': return 'info-circle';
                default: return 'info-circle';
            }
        }
        
        // 显示详细测试结果
        function showDetailedResults(results) {
            const resultsDiv = document.getElementById('testResults');
            
            let html = `
                <div class="row">
                    <div class="col-12">
                        <h4><i class="fas fa-chart-line"></i> 测试结果详情</h4>
                    </div>
                </div>
            `;
            
            results.forEach(result => {
                const statusClass = result.success ? 'success' : 'danger';
                const statusIcon = result.success ? 'check-circle' : 'times-circle';
                
                html += `
                    <div class="row mb-3">
                        <div class="col-12">
                            <div class="card border-${statusClass}">
                                <div class="card-header bg-${statusClass} text-white">
                                    <h5 class="mb-0">
                                        <i class="fas fa-${statusIcon}"></i> 
                                        ${result.api} - ${result.success ? '成功' : '失败'}
                                    </h5>
                                </div>
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <h6>响应状态</h6>
                                            <p class="text-muted">状态码: ${result.status}</p>
                                            <p class="text-muted">响应时间: ${result.duration}ms</p>
                                        </div>
                                        <div class="col-md-6">
                                            <h6>数据处理</h6>
                                            <p class="text-muted">原始数据类型: ${result.dataType}</p>
                                            <p class="text-muted">处理后数据量: ${result.processedCount}</p>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-12">
                                            <h6>原始响应数据</h6>
                                            <pre class="bg-light p-2 rounded"><code>${JSON.stringify(result.rawData, null, 2)}</code></pre>
                                        </div>
                                    </div>
                                    ${result.error ? `
                                        <div class="row">
                                            <div class="col-12">
                                                <h6 class="text-danger">错误信息</h6>
                                                <p class="text-danger">${result.error}</p>
                                            </div>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        }
        
        // 测试联系人API
        async function testContactsAPI() {
            showStatus('正在测试联系人API...', 'info');
            const result = await testAPI('/contacts', '联系人API');
            showDetailedResults([result]);
        }
        
        // 测试标签API
        async function testTagsAPI() {
            showStatus('正在测试标签API...', 'info');
            const result = await testAPI('/tags', '标签API');
            showDetailedResults([result]);
        }
        
        // 测试提醒API
        async function testRemindersAPI() {
            showStatus('正在测试提醒API...', 'info');
            const result = await testAPI('/reminders', '提醒API');
            showDetailedResults([result]);
        }
        
        // 测试所有API
        async function testAllAPIs() {
            showStatus('正在测试所有API...', 'info');
            
            const apis = [
                { url: '/contacts', name: '联系人API' },
                { url: '/tags', name: '标签API' },
                { url: '/reminders', name: '提醒API' }
            ];
            
            const results = [];
            
            for (const api of apis) {
                const result = await testAPI(api.url, api.name);
                results.push(result);
            }
            
            showDetailedResults(results);
        }
        
        // 通用API测试函数
        async function testAPI(url, name) {
            const startTime = Date.now();
            
            try {
                const { response, data } = await API.get(url);
                const duration = Date.now() - startTime;
                
                // 智能数据格式处理（模拟script.js中的逻辑）
                let processedData = [];
                let dataType = typeof data;
                
                if (Array.isArray(data)) {
                    processedData = data;
                    dataType = 'array';
                } else if (data && data.success && data.data) {
                    processedData = Array.isArray(data.data) ? data.data : [];
                    dataType = 'standard object with success field';
                } else if (data && typeof data === 'object') {
                    if (data.list && Array.isArray(data.list)) {
                        processedData = data.list;
                        dataType = 'object with list field';
                    } else if (data.content && Array.isArray(data.content)) {
                        processedData = data.content;
                        dataType = 'object with content field';
                    } else if (data.records && Array.isArray(data.records)) {
                        processedData = data.records;
                        dataType = 'object with records field';
                    } else {
                        processedData = [];
                        dataType = 'empty object';
                    }
                } else {
                    processedData = [];
                    dataType = 'unknown format';
                }
                
                return {
                    api: name,
                    success: response.ok,
                    status: response.status,
                    duration: duration,
                    dataType: dataType,
                    processedCount: processedData.length,
                    rawData: data,
                    error: null
                };
            } catch (error) {
                const duration = Date.now() - startTime;
                
                return {
                    api: name,
                    success: false,
                    status: 'N/A',
                    duration: duration,
                    dataType: 'N/A',
                    processedCount: 0,
                    rawData: {},
                    error: error.message
                };
            }
        }
    </script>
</body>
</html>
