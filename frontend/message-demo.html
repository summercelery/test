<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息提示演示</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <style>
        .demo-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .demo-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
            width: 100%;
        }
        
        .demo-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }
        
        .demo-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .demo-btn.success {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
        }
        
        .demo-btn.error {
            background: linear-gradient(135deg, #dc3545, #fd7e14);
            color: white;
        }
        
        .demo-btn.warning {
            background: linear-gradient(135deg, #ffc107, #fd7e14);
            color: white;
        }
        
        .demo-btn.info {
            background: linear-gradient(135deg, #17a2b8, #6f42c1);
            color: white;
        }
        
        .demo-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <!-- 背景动画 -->
    <div class="background-animation">
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
            <div class="shape shape-5"></div>
        </div>
    </div>

    <div class="demo-container">
        <div class="demo-card">
            <div class="text-center mb-4">
                <div class="logo mb-3">
                    <i class="fas fa-bell"></i>
                </div>
                <h2>消息提示演示</h2>
                <p class="text-muted">点击下方按钮体验不同类型的消息提示</p>
            </div>
            
            <div class="demo-buttons">
                <button class="demo-btn success" onclick="showSuccessMessage()">
                    <i class="fas fa-check-circle me-2"></i>成功消息
                </button>
                <button class="demo-btn error" onclick="showErrorMessage()">
                    <i class="fas fa-exclamation-circle me-2"></i>错误消息
                </button>
                <button class="demo-btn warning" onclick="showWarningMessage()">
                    <i class="fas fa-exclamation-triangle me-2"></i>警告消息
                </button>
                <button class="demo-btn info" onclick="showInfoMessage()">
                    <i class="fas fa-info-circle me-2"></i>信息消息
                </button>
            </div>
            
            <div class="text-center mt-4">
                <button class="btn btn-outline-primary" onclick="showRegistrationError()">
                    模拟注册错误
                </button>
            </div>
        </div>
    </div>

    <!-- 消息提示 -->
    <div id="messageContainer" class="message-container">
        <div id="messageBox" class="message-box" style="display: none;">
            <div class="message-icon">
                <i id="messageIcon" class="fas fa-info-circle"></i>
            </div>
            <div class="message-content">
                <h4 id="messageTitle" class="message-title">消息</h4>
                <p id="messageText" class="message-text">这是一条消息</p>
            </div>
            <button type="button" class="message-close" onclick="hideMessage()">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <script>
        // 显示消息
        function showMessage(message, type = 'info') {
            const messageBox = document.getElementById('messageBox');
            const messageIcon = document.getElementById('messageIcon');
            const messageTitle = document.getElementById('messageTitle');
            const messageText = document.getElementById('messageText');
            
            // 设置消息内容
            messageText.textContent = message;
            
            // 根据类型设置图标、标题和样式
            switch (type) {
                case 'success':
                    messageTitle.textContent = '成功';
                    messageIcon.className = 'fas fa-check-circle';
                    messageIcon.parentElement.className = 'message-icon success';
                    messageBox.className = 'message-box success';
                    break;
                case 'error':
                    messageTitle.textContent = '错误';
                    messageIcon.className = 'fas fa-exclamation-circle';
                    messageIcon.parentElement.className = 'message-icon error';
                    messageBox.className = 'message-box error';
                    break;
                case 'warning':
                    messageTitle.textContent = '警告';
                    messageIcon.className = 'fas fa-exclamation-triangle';
                    messageIcon.parentElement.className = 'message-icon warning';
                    messageBox.className = 'message-box warning';
                    break;
                default:
                    messageTitle.textContent = '信息';
                    messageIcon.className = 'fas fa-info-circle';
                    messageIcon.parentElement.className = 'message-icon info';
                    messageBox.className = 'message-box info';
                    break;
            }
            
            // 显示消息
            messageBox.style.display = 'flex';
            
            // 自动隐藏（除了错误消息）
            if (type !== 'error') {
                setTimeout(() => {
                    hideMessage();
                }, 3000);
            }
        }

        // 隐藏消息
        function hideMessage() {
            const messageBox = document.getElementById('messageBox');
            messageBox.style.display = 'none';
        }

        // 演示函数
        function showSuccessMessage() {
            showMessage('操作成功完成！您的账户已成功创建。', 'success');
        }

        function showErrorMessage() {
            showMessage('操作失败！请检查输入信息是否正确。', 'error');
        }

        function showWarningMessage() {
            showMessage('请注意！您的会话即将过期，请及时保存数据。', 'warning');
        }

        function showInfoMessage() {
            showMessage('系统提示：新功能已上线，欢迎体验！', 'info');
        }

        function showRegistrationError() {
            showMessage('请填写以下必填项：手机号、邮箱、密码、确认密码', 'error');
        }
    </script>
</body>
</html>
