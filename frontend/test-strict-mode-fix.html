<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>严格模式错误修复测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .test-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 2rem;
        }
        
        .test-section {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .test-result {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 4px;
            min-height: 100px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.9rem;
        }
        
        .test-result.success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .test-result.error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .test-result.info {
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }
        
        .btn-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        
        .log-entry {
            margin-bottom: 0.5rem;
            padding: 0.25rem;
            border-left: 3px solid #007bff;
            background-color: rgba(0,123,255,0.1);
        }
        
        .log-entry.error {
            border-left-color: #dc3545;
            background-color: rgba(220,53,69,0.1);
        }
        
        .log-entry.success {
            border-left-color: #28a745;
            background-color: rgba(40,167,69,0.1);
        }
        
        .log-entry.warning {
            border-left-color: #ffc107;
            background-color: rgba(255,193,7,0.1);
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="text-center mb-4">
            <h1><i class="fas fa-bug"></i> 严格模式错误修复测试</h1>
            <p class="text-muted">测试后端返回多个联系人时的严格模式错误修复效果</p>
        </div>

        <!-- 测试1：基本功能测试 -->
        <div class="test-section">
            <h3><i class="fas fa-check-circle"></i> 测试1：基本功能测试</h3>
            <p>测试修复补丁是否正常加载，以及基本的数组处理功能</p>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="testBasicFunctionality()">
                    <i class="fas fa-play"></i> 运行测试
                </button>
                <button class="btn btn-secondary" onclick="clearResult('test1')">
                    <i class="fas fa-trash"></i> 清空结果
                </button>
            </div>
            <div id="test1Result" class="test-result info"></div>
        </div>

        <!-- 测试2：loadContactsForSelection测试 -->
        <div class="test-section">
            <h3><i class="fas fa-users"></i> 测试2：联系人加载测试</h3>
            <p>测试 loadContactsForSelection 函数处理多个联系人数据</p>
            <div class="btn-group">
                <button class="btn btn-warning" onclick="testLoadContactsForSelection()">
                    <i class="fas fa-play"></i> 测试联系人加载
                </button>
                <button class="btn btn-info" onclick="testMultipleContacts()">
                    <i class="fas fa-database"></i> 测试多个联系人
                </button>
                <button class="btn btn-secondary" onclick="clearResult('test2')">
                    <i class="fas fa-trash"></i> 清空结果
                </button>
            </div>
            <div id="test2Result" class="test-result info"></div>
        </div>

        <!-- 测试3：严格模式错误模拟 -->
        <div class="test-section">
            <h3><i class="fas fa-exclamation-triangle"></i> 测试3：严格模式错误模拟</h3>
            <p>尝试触发严格模式错误，测试错误捕获机制</p>
            <div class="btn-group">
                <button class="btn btn-danger" onclick="testStrictModeError()">
                    <i class="fas fa-bomb"></i> 触发严格模式错误
                </button>
                <button class="btn btn-success" onclick="testErrorRecovery()">
                    <i class="fas fa-medkit"></i> 测试错误恢复
                </button>
                <button class="btn btn-secondary" onclick="clearResult('test3')">
                    <i class="fas fa-trash"></i> 清空结果
                </button>
            </div>
            <div id="test3Result" class="test-result info"></div>
        </div>

        <!-- 测试4：实际数据格式测试 -->
        <div class="test-section">
            <h3><i class="fas fa-server"></i> 测试4：实际数据格式测试</h3>
            <p>测试各种可能的后端数据格式处理</p>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="testDataFormats()">
                    <i class="fas fa-play"></i> 测试所有格式
                </button>
                <button class="btn btn-info" onclick="testEmptyData()">
                    <i class="fas fa-circle-notch"></i> 测试空数据
                </button>
                <button class="btn btn-secondary" onclick="clearResult('test4')">
                    <i class="fas fa-trash"></i> 清空结果
                </button>
            </div>
            <div id="test4Result" class="test-result info"></div>
        </div>

        <!-- 全局测试控制 -->
        <div class="test-section">
            <h3><i class="fas fa-cogs"></i> 全局控制</h3>
            <div class="btn-group">
                <button class="btn btn-success" onclick="runAllTests()">
                    <i class="fas fa-play-circle"></i> 运行所有测试
                </button>
                <button class="btn btn-warning" onclick="clearAllResults()">
                    <i class="fas fa-broom"></i> 清空所有结果
                </button>
                <button class="btn btn-info" onclick="showDebugInfo()">
                    <i class="fas fa-info-circle"></i> 显示调试信息
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="fix-strict-mode-error.js"></script>
    <script src="script.js"></script>
    <script>
        // 测试日志记录
        function logToResult(containerId, message, type = 'info') {
            const container = document.getElementById(containerId);
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.innerHTML = `<strong>[${timestamp}]</strong> ${message}`;
            container.appendChild(logEntry);
            container.scrollTop = container.scrollHeight;
        }

        function clearResult(testId) {
            document.getElementById(testId + 'Result').innerHTML = '';
        }

        function clearAllResults() {
            for (let i = 1; i <= 4; i++) {
                clearResult('test' + i);
            }
        }

        // 测试1：基本功能测试
        function testBasicFunctionality() {
            const containerId = 'test1Result';
            logToResult(containerId, '开始基本功能测试...', 'info');

            try {
                // 测试修复补丁是否加载
                if (typeof SafeArrayUtils !== 'undefined') {
                    logToResult(containerId, '✅ SafeArrayUtils 已加载', 'success');
                    
                    // 测试数组处理
                    const testArray = [1, 2, 3, 4, 5];
                    const clonedArray = SafeArrayUtils.clone(testArray);
                    logToResult(containerId, `✅ 数组克隆测试: ${JSON.stringify(clonedArray)}`, 'success');
                    
                    // 测试类数组转换
                    const nodeList = document.querySelectorAll('button');
                    const realArray = SafeArrayUtils.toArray(nodeList);
                    logToResult(containerId, `✅ 类数组转换测试: 转换了 ${realArray.length} 个元素`, 'success');
                } else {
                    logToResult(containerId, '❌ SafeArrayUtils 未加载', 'error');
                }

                if (typeof SafeObjectUtils !== 'undefined') {
                    logToResult(containerId, '✅ SafeObjectUtils 已加载', 'success');
                    
                    // 测试对象访问
                    const testObj = { a: { b: { c: 'deep value' } } };
                    const value = SafeObjectUtils.get(testObj, 'a.b.c', 'default');
                    logToResult(containerId, `✅ 对象访问测试: ${value}`, 'success');
                } else {
                    logToResult(containerId, '❌ SafeObjectUtils 未加载', 'error');
                }

                logToResult(containerId, '✅ 基本功能测试完成', 'success');
            } catch (error) {
                logToResult(containerId, `❌ 基本功能测试失败: ${error.message}`, 'error');
            }
        }

        // 测试2：联系人加载测试
        function testLoadContactsForSelection() {
            const containerId = 'test2Result';
            logToResult(containerId, '开始联系人加载测试...', 'info');

            try {
                // 模拟loadContactsForSelection函数
                if (typeof loadContactsForSelection === 'function') {
                    logToResult(containerId, '✅ loadContactsForSelection 函数存在', 'success');
                    
                    // 调用函数
                    loadContactsForSelection().then(() => {
                        logToResult(containerId, '✅ loadContactsForSelection 执行完成', 'success');
                        
                        // 检查结果
                        if (typeof window.availableContacts !== 'undefined') {
                            logToResult(containerId, `✅ 联系人数据已设置: ${window.availableContacts.length} 个`, 'success');
                        } else {
                            logToResult(containerId, '⚠️ 联系人数据未设置', 'warning');
                        }
                    }).catch(error => {
                        logToResult(containerId, `❌ loadContactsForSelection 执行失败: ${error.message}`, 'error');
                    });
                } else {
                    logToResult(containerId, '❌ loadContactsForSelection 函数不存在', 'error');
                }
            } catch (error) {
                logToResult(containerId, `❌ 联系人加载测试失败: ${error.message}`, 'error');
            }
        }

        function testMultipleContacts() {
            const containerId = 'test2Result';
            logToResult(containerId, '开始多个联系人测试...', 'info');

            try {
                // 模拟多个联系人数据
                const mockContacts = [
                    { id: 1, name: '张三', phoneNumber: '13800138001' },
                    { id: 2, name: '李四', phoneNumber: '13800138002' },
                    { id: 3, name: '王五', phoneNumber: '13800138003' },
                    { id: 4, name: '赵六', phoneNumber: '13800138004' },
                    { id: 5, name: '钱七', phoneNumber: '13800138005' }
                ];

                // 使用安全的数组操作
                if (typeof SafeArrayUtils !== 'undefined') {
                    const safeContacts = SafeArrayUtils.clone(mockContacts);
                    window.availableContacts = safeContacts;
                    logToResult(containerId, `✅ 成功设置 ${safeContacts.length} 个联系人`, 'success');
                    
                    // 测试访问每个联系人
                    safeContacts.forEach((contact, index) => {
                        logToResult(containerId, `📞 联系人 ${index + 1}: ${contact.name} - ${contact.phoneNumber}`, 'info');
                    });
                } else {
                    logToResult(containerId, '❌ SafeArrayUtils 不可用', 'error');
                }
            } catch (error) {
                logToResult(containerId, `❌ 多个联系人测试失败: ${error.message}`, 'error');
            }
        }

        // 测试3：严格模式错误模拟
        function testStrictModeError() {
            const containerId = 'test3Result';
            logToResult(containerId, '开始严格模式错误测试...', 'info');

            try {
                // 尝试触发严格模式错误
                function problematicFunction() {
                    'use strict';
                    try {
                        // 这会在严格模式下抛出错误
                        const func = function() { return arguments.callee; };
                        func();
                    } catch (e) {
                        throw new Error("'caller', 'callee', and 'arguments' properties may not be accessed on strict mode functions");
                    }
                }

                problematicFunction();
            } catch (error) {
                if (error.message.includes('arguments') || error.message.includes('caller') || error.message.includes('callee')) {
                    logToResult(containerId, '✅ 严格模式错误已被捕获', 'success');
                    logToResult(containerId, `🔧 错误信息: ${error.message}`, 'warning');
                } else {
                    logToResult(containerId, `❌ 意外错误: ${error.message}`, 'error');
                }
            }
        }

        function testErrorRecovery() {
            const containerId = 'test3Result';
            logToResult(containerId, '开始错误恢复测试...', 'info');

            try {
                // 模拟一个严格模式错误后的恢复
                window.addEventListener('error', function(event) {
                    if (event.error && event.error.message.includes('arguments')) {
                        logToResult(containerId, '✅ 全局错误处理器捕获了严格模式错误', 'success');
                    }
                });

                // 继续正常操作
                const testArray = [1, 2, 3, 4, 5];
                const result = testArray.map(x => x * 2);
                logToResult(containerId, `✅ 错误后正常操作: ${JSON.stringify(result)}`, 'success');
            } catch (error) {
                logToResult(containerId, `❌ 错误恢复测试失败: ${error.message}`, 'error');
            }
        }

        // 测试4：实际数据格式测试
        function testDataFormats() {
            const containerId = 'test4Result';
            logToResult(containerId, '开始数据格式测试...', 'info');

            const testFormats = [
                { name: '直接数组', data: [{ id: 1, name: '测试1' }, { id: 2, name: '测试2' }] },
                { name: '标准格式', data: { success: true, data: [{ id: 1, name: '测试1' }] } },
                { name: 'list格式', data: { list: [{ id: 1, name: '测试1' }] } },
                { name: 'content格式', data: { content: [{ id: 1, name: '测试1' }] } },
                { name: 'records格式', data: { records: [{ id: 1, name: '测试1' }] } },
                { name: '空对象', data: {} },
                { name: '空数组', data: [] }
            ];

            testFormats.forEach(format => {
                try {
                    let contacts = [];
                    
                    if (Array.isArray(format.data)) {
                        contacts = [...format.data];
                    } else if (format.data && format.data.success && format.data.data) {
                        contacts = Array.isArray(format.data.data) ? [...format.data.data] : [];
                    } else if (format.data && typeof format.data === 'object') {
                        if (format.data.list && Array.isArray(format.data.list)) {
                            contacts = [...format.data.list];
                        } else if (format.data.content && Array.isArray(format.data.content)) {
                            contacts = [...format.data.content];
                        } else if (format.data.records && Array.isArray(format.data.records)) {
                            contacts = [...format.data.records];
                        }
                    }
                    
                    logToResult(containerId, `✅ ${format.name}: 解析出 ${contacts.length} 个联系人`, 'success');
                } catch (error) {
                    logToResult(containerId, `❌ ${format.name}: 解析失败 - ${error.message}`, 'error');
                }
            });
        }

        function testEmptyData() {
            const containerId = 'test4Result';
            logToResult(containerId, '开始空数据测试...', 'info');

            const emptyFormats = [null, undefined, '', 0, false, NaN, {}, []];
            
            emptyFormats.forEach((emptyData, index) => {
                try {
                    const contacts = Array.isArray(emptyData) ? emptyData : [];
                    logToResult(containerId, `✅ 空数据测试 ${index + 1}: ${JSON.stringify(emptyData)} -> ${contacts.length} 个联系人`, 'success');
                } catch (error) {
                    logToResult(containerId, `❌ 空数据测试 ${index + 1}: ${error.message}`, 'error');
                }
            });
        }

        // 运行所有测试
        function runAllTests() {
            clearAllResults();
            
            setTimeout(() => testBasicFunctionality(), 100);
            setTimeout(() => testLoadContactsForSelection(), 500);
            setTimeout(() => testMultipleContacts(), 1000);
            setTimeout(() => testStrictModeError(), 1500);
            setTimeout(() => testErrorRecovery(), 2000);
            setTimeout(() => testDataFormats(), 2500);
            setTimeout(() => testEmptyData(), 3000);
        }

        // 显示调试信息
        function showDebugInfo() {
            const debugInfo = {
                'SafeArrayUtils': typeof SafeArrayUtils !== 'undefined',
                'SafeObjectUtils': typeof SafeObjectUtils !== 'undefined',
                'loadContactsForSelection': typeof loadContactsForSelection !== 'undefined',
                'window.availableContacts': typeof window.availableContacts !== 'undefined',
                'availableContacts length': window.availableContacts ? window.availableContacts.length : 'N/A',
                'User Agent': navigator.userAgent,
                'Script errors count': window.scriptErrorCount || 0
            };
            
            console.log('🔍 调试信息:', debugInfo);
            alert('调试信息已输出到控制台，请按 F12 查看');
        }

        // 页面加载时的初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔧 严格模式错误修复测试页面已加载');
            
            // 检查修复补丁是否加载
            if (typeof SafeArrayUtils !== 'undefined') {
                console.log('✅ 修复补丁已成功加载');
            } else {
                console.log('❌ 修复补丁未加载');
            }
        });
    </script>
</body>
</html>
