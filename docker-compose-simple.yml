version: '3.8'

services:
  # 后端Spring Boot应用 - 使用host网络
  backend:
    build: .
    network_mode: host
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/user_auth_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      - SPRING_REDIS_HOST=localhost
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # 前端Nginx应用 - 使用host网络
  frontend:
    build: ./frontend
    network_mode: host
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - ./frontend/nginx-simple.conf:/etc/nginx/conf.d/default.conf

# 使用host网络模式，直接连接到主机上的MySQL和Redis 